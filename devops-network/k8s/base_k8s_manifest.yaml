# ============================================================
# Часть 1: Deployment
# Deployment — это контроллер, который следит за подами:
# держит нужное количество реплик, перезапускает упавшие,
# умеет катить обновления без простоя (rolling update).
# ============================================================
apiVersion: apps/v1        # Версия API, к которой относится ресурс.
                           # Deployment живёт в apps/v1 — это устоявшийся стандарт.
kind: Deployment           # Тип ресурса. Определяет структуру всего документа ниже.
metadata:
  name: hello-app          # Имя Deployment. Уникально в рамках неймспейса.
  labels:
    app: hello-app         # Метки самого объекта Deployment (не путать с метками подов).
                           # По ним удобно фильтровать: kubectl get deploy -l app=hello-app
spec:
  replicas: 3              # Сколько подов должно быть запущено.
                           # Уменьшишь/увеличишь — кластер приведёт реальность к этому числу.

  selector:                # «Как найти поды, которыми я управляю?»
    matchLabels:
      app: hello-app       # Deployment берёт поды, у которых label app=hello-app.
                           # ВАЖНО: этот selector менять после создания нельзя —
                           # поды «перестанут принадлежать» Deployment'у.

  template:                # Шаблон пода. Из него Kubernetes штампует реплики.
    metadata:
      labels:
        app: hello-app     # Метки, которые получит каждый созданный под.
                           # Должны совпадать с selector выше — иначе Deployment
                           # не поймёт, сколько подов уже запущено.
    spec:
      containers:
        - name: web                    # Имя контейнера внутри пода (логи, exec и т.д.).
          image: nginx:alpine          # Образ: nginx на базе Alpine (~50 МБ).
                                       # Без тега kubectl взял бы :latest — так лучше явно.

          ports:
            - containerPort: 80        # Информационное поле: порт, который слушает контейнер.
                                       # Само по себе ничего не «открывает», но нужно для
                                       # читаемости и используется некоторыми инструментами.

          env:
            - name: MESSAGE
              value: "Hello from Kubernetes!"   # Переменная окружения, попадает внутрь контейнера.

          # Command и args полностью заменяют ENTRYPOINT и CMD образа.
          # Здесь трюк: вместо дефолтного запуска nginx мы сначала
          # генерируем index.html с нашим сообщением, а потом запускаем nginx.
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "<h1>${MESSAGE}</h1>" > /usr/share/nginx/html/index.html;
              nginx -g "daemon off;"
          # "daemon off;" — это требование: в контейнере процесс должен
          # работать на переднем плане. Если главный процесс умрёт,
          # контейнер перезапустится.

          resources:                   # Лимиты и запросы ресурсов — хорошая привычка
                                       # с самого начала: без них один контейнер может
                                       # съесть всю память ноды.
            requests:                  # Гарантированный минимум.
              cpu: 50m                 # 50 милли-CPU (5% одного ядра).
              memory: 64Mi
            limits:                    # Потолок. Превышение памяти = контейнер убьют (OOMKilled).
              cpu: 100m
              memory: 128Mi
---
# ============================================================
# Часть 2: Service
# Поды живут недолго: при пересоздании у них меняются IP.
# Service даёт стабильную точку доступа и балансирует трафик
# между всеми подами, подходящими под selector.
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: hello-service     # По этому имени к сервису можно обратиться изнутри
                          # кластера: http://hello-service (работает DNS-аддон).
spec:
  type: ClusterIP         # Внутренний IP, доступен только внутри кластера.
                          # NodePort — снаружи через порт ноды,
                          # LoadBalancer — нужен metallb/cloud-провайдер.
  ports:
    - port: 80            # Порт, на котором сервис слушает (внутри кластера).
      targetPort: 80      # Порт контейнера в поде, куда трафик перенаправляется.
                          # Можно писать именем порта, если у containerPort есть name.
  selector:
    app: hello-app        # Кого балансировать: все поды с этой меткой.
                          # Совпадение с метками шаблона пода — обязательное условие.
