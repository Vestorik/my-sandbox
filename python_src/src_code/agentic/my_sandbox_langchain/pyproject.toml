[project]
name = "my-sandbox-langchain"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "my-sandbox-other-tools",
    "langchain>=1.4.9",
    "langchain-openai>=1.7.4",
]


[tool.uv.sources]
my-sandbox-other-tools = { workspace = true }


[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
