[project]
name = "my-sandbox-other-tools"
version = "0.1.01"
requires-python = ">=3.14"
dependencies = [
    "pyinstrument>=5.1.3",
    "yappi>=1.7.6",
    "concurrent-log-handler>=0.9.29",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
