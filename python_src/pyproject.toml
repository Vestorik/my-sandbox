# MY SANDBOX FOR RESEARCH - PROTOTYPE - STUDY
[project]
name = "python-my-sandbox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["my-sandbox-langchain", "my-sandbox-other-tools"]


[tool.uv]
default-groups = ["torch", "math", "nn-agent", "rel-database", "validation"]
index-url = "https://pypi.org/simple"


[tool.uv.workspace]
members = ["src_code/other_tools", "src_code/agentic/my_sandbox_langchain"]


[[tool.uv.index]]
# ТОЛЬКО для torch/torchvision, не для других пакетов
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
# //end

[tool.uv.sources]
# ТОЛЬКО для torch/torchvision, не для других пакетов
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
# //end

my-sandbox-langchain = { workspace = true }
my-sandbox-other-tools = { workspace = true }


# //----------------------------------------------------------------------
# //----------------------------------------------------------------------
[dependency-groups]

# // ML and RESEARCH // --------------------------------------------------
torch = ["torch>=2.10.0", "torchvision>=0.25.0", "tqdm>=4.66.5"]

math = ["numpy>=2.5.4", "scipy>=1.18.1"]

# // DATA // -------------------------------------------------------------
rel-database = ["sqlalchemy>=2.1.8"]


# // INFRASTRUCTURE // ---------------------------------------------------

nn-agent = [
    "langchain>=1.4.9",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "llama-index>=0.14.25",
]

ml-support = ["litellm>=1.108.3"]

web = ["litestar>=2.25.0"]

validation = [
    "msgspec>=0.22.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
]


# // TEST // -------------------------------------------------------------
test = [
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "pytest-xdist>=3.8.0",
    "pytest>=9.2.0",
]
dev-tools = ["pyinstrument>=5.1.3", "yappi>=1.7.6"]
